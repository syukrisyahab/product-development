<style>
  /* ── DESIGN TOKENS ── */
  :root {
    --c-green:        #00B050;
    --c-green-dark:   #007A33;
    --c-green-light:  #31B85A;
    --c-purple:       #A64CA6;
    --c-orange:       #F28C28;
    --c-red:          #EF4444;
    --c-red-dark:     #B91C1C;
    --c-blue:         #3B82F6;
    --c-gray-text:    #1F2937;
    --c-gray-muted:   #6B7280;
    --c-bg-page:      #F3F4F6;
    --c-bg-card:      #FFFFFF;
    --c-border:       #E5E7EB;
    --c-border-soft:  #F3F4F6;
    --c-shadow:       0 2px 12px rgba(0,0,0,.07);
    --c-shadow-md:    0 8px 28px rgba(0,0,0,.12);
    --radius-sm:      8px;
    --radius-md:      12px;
    --radius-lg:      16px;
    --radius-xl:      20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--c-bg-page);
    color: var(--c-gray-text);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── APP SHELL ── */
  .app-shell { padding: 16px; }

  /* ── HEADER ── */
  .app-header {
    background: linear-gradient(135deg, var(--c-green-dark), var(--c-green));
    color: #fff;
    border-radius: var(--radius-xl);
    padding: 18px 22px;
    box-shadow: var(--c-shadow-md);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 12px;
  }
  .app-title    { font-size: 20px; font-weight: 800; }
  .app-subtitle { font-size: 11px; opacity: .85; margin-top: 3px; }
  .user-info    { text-align: right; font-size: 12px; line-height: 1.5; flex-shrink: 0; }

  .access-pill {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 11px;
    background: rgba(255,255,255,.2);
  }
  .access-pill.not-allowed { background: rgba(239,68,68,.35); }

  /* ── TABS (Dashboard | Admin) ── */
  .view-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tab-btn {
    padding: 7px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--c-border);
    background: var(--c-bg-card);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--c-gray-muted);
    transition: .15s;
  }
  .tab-btn.active {
    background: var(--c-green);
    color: #fff;
    border-color: var(--c-green);
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .toolbar-left  { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── BUTTONS ── */
  .btn {
    border: none;
    border-radius: var(--radius-md);
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: .15s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-primary   { background: var(--c-green);  color: #fff; }
  .btn-primary:hover { background: var(--c-green-dark); }
  .btn-secondary { background: var(--c-bg-card); color: var(--c-gray-text); border: 1px solid var(--c-border); }
  .btn-secondary:hover { background: #F9FAFB; }
  .btn-danger    { background: rgba(239,68,68,.1); color: var(--c-red-dark); border: 1px solid rgba(239,68,68,.25); }
  .btn-danger:hover { background: rgba(239,68,68,.18); }
  .btn-sm        { padding: 5px 10px; font-size: 11px; border-radius: var(--radius-sm); }
  .btn:disabled  { opacity: .55; cursor: not-allowed; }

  .btn-update {
    background: rgba(166,76,166,.1);
    color: var(--c-purple);
    border: 1px solid rgba(166,76,166,.3);
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-edit   { background: rgba(59,130,246,.1); color: #1D4ED8; border: 1px solid rgba(59,130,246,.3); }
  .btn-cancel { background: rgba(239,68,68,.08); color: var(--c-red-dark); border: 1px solid rgba(239,68,68,.25); }

  /* ── MSG BAR ── */
  #msg {
    background: var(--c-bg-card);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: 9px 14px;
    margin-bottom: 12px;
    color: var(--c-gray-muted);
    font-size: 12px;
    box-shadow: var(--c-shadow);
  }

  /* ── SUMMARY CARDS ── */
  .card-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }
  .card {
    background: var(--c-bg-card);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    box-shadow: var(--c-shadow);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: var(--c-green);
  }
  .card:nth-child(2)::before { background: var(--c-purple); }
  .card:nth-child(3)::before { background: var(--c-red); }
  .card:nth-child(4)::before { background: var(--c-orange); }

  .card-title { font-size: 10px; font-weight: 800; color: var(--c-gray-muted); text-transform: uppercase; letter-spacing: .05em; }
  .card-value { font-size: 28px; font-weight: 800; margin-top: 6px; }
  .card-sub   { font-size: 10px; color: var(--c-gray-muted); margin-top: 2px; }

  /* ── FILTER ROW ── */
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--c-bg-card);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: var(--c-shadow);
  }
  .filter-row input,
  .filter-row select {
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: 7px 10px;
    font-size: 12px;
    background: #fff;
    outline: none;
    transition: .15s;
  }
  .filter-row input { min-width: 240px; flex: 1; }
  .filter-row input:focus,
  .filter-row select:focus {
    border-color: var(--c-green);
    box-shadow: 0 0 0 3px rgba(0,176,80,.12);
  }
  .filter-sla-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid transparent;
  }

  /* ── TABLE ── */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    background: var(--c-bg-card);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--c-shadow);
  }
  #tblPD {
    width: max-content;
    min-width: 100%;
    border-collapse: collapse;
  }
  #theadPD th {
    background: #F9FAFB;
    color: var(--c-gray-muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    border-bottom: 1px solid var(--c-border);
    padding: 10px 12px;
    white-space: nowrap;
    text-align: left;
    user-select: none;
  }
  #theadPD th.sortable { cursor: pointer; }
  #theadPD th.sortable:hover { color: var(--c-green-dark); }
  #theadPD th .sort-icon { margin-left: 4px; opacity: .5; }
  #theadPD th.sort-asc  .sort-icon::after { content: ' ↑'; opacity: 1; }
  #theadPD th.sort-desc .sort-icon::after { content: ' ↓'; opacity: 1; }

  #tbodyPD td {
    font-size: 12px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--c-border-soft);
    white-space: nowrap;
    vertical-align: middle;
  }
  #tbodyPD tr:hover td { background: #F8FAFC; }
  #tbodyPD tr.row-notok  td { background: #FFF1F2; }
  #tbodyPD tr.row-final  td { background: #F0FDF4; }
  #tbodyPD tr.row-archived td { background: #F9FAFB; opacity: .7; }
  #tbodyPD tr.row-overdue td { background: #FFFBEB; }

  td a { color: var(--c-green-dark); font-weight: 700; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .id-link { color: var(--c-green-dark); font-weight: 800; cursor: pointer; text-decoration: underline; font-size: 12px; }

  .empty-state { padding: 48px; text-align: center; color: var(--c-gray-muted); font-size: 14px; }

  /* ── BADGES ── */
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
  }
  .badge-ok       { background: rgba(0,176,80,.12);   color: var(--c-green-dark); }
  .badge-notok    { background: rgba(239,68,68,.12);  color: var(--c-red-dark); }
  .badge-ongoing  { background: rgba(166,76,166,.12); color: var(--c-purple); }
  .badge-new      { background: rgba(59,130,246,.1);  color: #1D4ED8; }
  .badge-cancelled{ background: #F3F4F6;              color: var(--c-gray-muted); }

  /* SLA badges */
  .sla-overdue { background: rgba(239,68,68,.12);  color: var(--c-red-dark);  font-size: 10px; }
  .sla-warning { background: rgba(245,158,11,.12); color: #92400E; font-size: 10px; }
  .sla-ok      { background: rgba(0,176,80,.08);   color: var(--c-green-dark); font-size: 10px; }
  .sla-final   { background: rgba(0,176,80,.12);   color: var(--c-green-dark); font-size: 10px; }
  .sla-new     { background: rgba(59,130,246,.1);  color: #1D4ED8; font-size: 10px; }

  /* ── ACTION CELL ── */
  .action-cell { display: flex; gap: 4px; flex-wrap: wrap; }

  /* ── MOBILE CARD VIEW ── */
  #cardList { display: none; }
  .pd-card {
    background: var(--c-bg-card);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: var(--c-shadow);
  }
  .pd-card.notok   { border-left: 4px solid var(--c-red); }
  .pd-card.final   { border-left: 4px solid var(--c-green); }
  .pd-card.overdue { border-left: 4px solid #F59E0B; }
  .pd-card-id     { font-weight: 800; color: var(--c-green-dark); cursor: pointer; }
  .pd-card-title  { font-size: 14px; font-weight: 700; margin: 4px 0 8px; }
  .pd-card-meta   { font-size: 11px; color: var(--c-gray-muted); line-height: 1.8; }
  .pd-card-footer { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── MODALS ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    align-items: center;
    justify-content: center;
    z-index: 900;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--c-bg-card);
    border-radius: var(--radius-xl);
    box-shadow: 0 24px 60px rgba(0,0,0,.2);
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box-sm  { max-width: 480px; }
  .modal-box-md  { max-width: 600px; }
  .modal-box-lg  { max-width: 820px; }
  .modal-box-xl  { max-width: 1000px; }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--c-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--c-bg-card);
    z-index: 1;
  }
  .modal-header h3 { font-size: 16px; font-weight: 800; }
  .modal-close {
    border: 1px solid var(--c-border);
    background: #fff;
    border-radius: var(--radius-sm);
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body   { padding: 16px 20px; }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--c-border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    position: sticky;
    bottom: 0;
    background: var(--c-bg-card);
  }

  /* ── FORM ELEMENTS ── */
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--c-gray-muted);
  }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    background: #fff;
    color: var(--c-gray-text);
    transition: .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--c-green);
    box-shadow: 0 0 0 3px rgba(0,176,80,.12);
  }
  input:disabled, select:disabled { background: #F9FAFB; color: var(--c-gray-muted); }
  textarea { resize: vertical; }

  .radio-row { display: flex; gap: 20px; align-items: center; margin-top: 6px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--c-gray-text); }
  .radio-row input { width: auto; }

  small { color: var(--c-gray-muted); font-size: 11px; }
  .field-hint { font-size: 11px; color: var(--c-gray-muted); margin-top: 3px; }

  /* ── HISTORY TIMELINE ── */
  .timeline { padding: 4px 0; }
  .timeline-item {
    display: flex;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--c-border-soft);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px;
  }
  .timeline-dot.ok       { background: rgba(0,176,80,.15); color: var(--c-green-dark); }
  .timeline-dot.notok    { background: rgba(239,68,68,.12); color: var(--c-red-dark); }
  .timeline-dot.pending  { background: #F3F4F6; color: var(--c-gray-muted); }
  .timeline-content { flex: 1; min-width: 0; }
  .timeline-step    { font-weight: 800; font-size: 13px; }
  .timeline-meta    { font-size: 11px; color: var(--c-gray-muted); margin-top: 2px; }
  .timeline-note    { font-size: 12px; margin-top: 4px; background: #F9FAFB; border-radius: var(--radius-sm); padding: 6px 10px; }

  /* ── ADMIN PANEL ── */
  .admin-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 2px solid var(--c-border); padding-bottom: 0; }
  .admin-tab  {
    padding: 8px 16px;
    font-size: 12px; font-weight: 700;
    cursor: pointer; border: none; background: none;
    color: var(--c-gray-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: .15s;
  }
  .admin-tab.active { color: var(--c-green-dark); border-bottom-color: var(--c-green); }
  .admin-panel-section { display: none; }
  .admin-panel-section.active { display: block; }

  .users-table, .config-table, .logs-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .users-table th, .config-table th, .logs-table th {
    background: #F9FAFB;
    padding: 8px 12px;
    border-bottom: 1px solid var(--c-border);
    text-align: left;
    font-weight: 800;
    font-size: 11px;
    color: var(--c-gray-muted);
    text-transform: uppercase;
  }
  .users-table td, .config-table td, .logs-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--c-border-soft);
    vertical-align: middle;
  }
  .users-table tr:hover td, .config-table tr:hover td, .logs-table tr:hover td {
    background: #F8FAFC;
  }

  .status-chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
  }
  .status-chip.active   { background: rgba(0,176,80,.12); color: var(--c-green-dark); }
  .status-chip.inactive { background: rgba(239,68,68,.1); color: var(--c-red-dark); }

  /* ── TOAST NOTIFICATION ── */
  #toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #1F2937;
    color: #fff;
    padding: 11px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--c-shadow-md);
    max-width: 340px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toast-in .25s ease;
    pointer-events: auto;
  }
  .toast.success { border-left: 4px solid var(--c-green); }
  .toast.error   { border-left: 4px solid var(--c-red); }
  .toast.info    { border-left: 4px solid var(--c-blue); }
  .toast-out     { animation: toast-out .3s ease forwards; }
  @keyframes toast-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { from { opacity: 1; transform: translateY(0); }   to { opacity: 0; transform: translateY(12px); } }

  /* ── CONFIRM MODAL ── */
  .confirm-icon { font-size: 40px; text-align: center; margin-bottom: 10px; }
  .confirm-msg  { text-align: center; font-size: 14px; line-height: 1.6; color: var(--c-gray-text); }
  .confirm-sub  { text-align: center; font-size: 12px; color: var(--c-gray-muted); margin-top: 6px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .card-row { grid-template-columns: repeat(2, 1fr); }
    .app-header { flex-direction: column; align-items: flex-start; }
    .user-info  { text-align: left; }
    .col-deskripsi, .col-ket, .col-updatedby, .col-statusnote { display: none; }
  }

  @media (max-width: 640px) {
    .app-shell { padding: 10px; }
    .card-row  { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card-value { font-size: 22px; }
    .filter-row input { min-width: 100%; }
    .table-wrap { display: none; }
    #cardList   { display: block; }
    .toolbar    { flex-direction: column; align-items: stretch; }
    .toolbar-left, .toolbar-right { width: 100%; justify-content: stretch; }
    .btn { flex: 1; justify-content: center; }
  }
</style>
